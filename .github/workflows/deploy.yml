name: CI/CD Pipeline

on:
  push:
    branches: [ 4-feature/server-infra ]
  pull_request:
    branches: [ 4-feature/server-infra ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Run tests
        run: ./gradlew test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-jar
          path: build/libs/*-SNAPSHOT.jar
          if-no-files-found: error

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: collaboration-jar
          path: ./artifacts

      - name: List downloaded files
        run: |
          echo "=== Downloaded files ==="
          ls -lah ./artifacts/
          echo "======================="

      - name: Debug secrets
        run: |
          echo "EC2_HOST length: ${#EC2_HOST}"
          echo "EC2_USERNAME length: ${#EC2_USERNAME}"
          echo "EC2_HOST (hex): " | xxd
          echo "$EC2_HOST" | xxd
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # 변수 정리 (앞뒤 공백 제거)
          EC2_HOST=$(echo "$EC2_HOST" | tr -d '[:space:]')
          EC2_USERNAME=$(echo "$EC2_USERNAME" | tr -d '[:space:]')

          echo "Cleaned EC2_HOST: $EC2_HOST"
          echo "Cleaned EC2_USERNAME: $EC2_USERNAME"

          # SSH 키 설정                                                                       
          echo "$EC2_SSH_KEY" > ec2_key.pem                                                   
          chmod 400 ec2_key.pem                                                               

          # JAR 파일을 EC2로 전송
          scp -i ec2_key.pem -o StrictHostKeyChecking=no \
            ./artifacts/*-SNAPSHOT.jar $EC2_USERNAME@$EC2_HOST:~/app/collaboration.jar                             

          # EC2에서 애플리케이션 재시작                                                       
          ssh -i ec2_key.pem -o StrictHostKeyChecking=no \                                    
            $EC2_USERNAME@$EC2_HOST << 'EOF'                                                  
            sudo systemctl restart collaboration                                              
            sudo systemctl status collaboration                                               
          EOF                                                                                 
